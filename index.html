<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShiftDesk - Agent Workforce</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07080f;--s:#0d0f1a;--s2:#131629;--s3:#1a1e33;--b:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.10);--tx:#e8ecff;--mu:#6b728e;--mu2:#3d4260;--ac:#6c63ff;--ac2:#8b5cf6;--gr:#10b981;--rd:#f43f5e;--yl:#fbbf24;--or:#fb923c;--r:8px;--rl:14px;--rxl:20px;--font:'Inter',-apple-system,sans-serif;--tr:all .18s cubic-bezier(.4,0,.2,1)}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;overflow:hidden}
.app{display:flex;height:100vh;overflow:hidden}
.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;background:var(--bg);padding:20px}
.auth-card{background:var(--s);border:1px solid var(--b2);border-radius:var(--rxl);padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.auth-logo{text-align:center;margin-bottom:30px}
.auth-logo h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-logo p{color:var(--mu);margin-top:6px;font-size:13px}
.auth-tabs{display:flex;gap:8px;margin-bottom:24px;background:var(--bg);border-radius:var(--r);padding:4px}
.auth-tab{flex:1;padding:8px;text-align:center;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--mu);transition:var(--tr)}
.auth-tab.active{background:var(--ac);color:#fff}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);padding:10px 14px;color:var(--tx);font-size:14px;font-family:var(--font);outline:none;transition:var(--tr)}
.form-group input:focus,.form-group select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
.form-group select option{background:var(--s2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;transition:var(--tr);font-family:var(--font)}
.btn-primary{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;width:100%}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-danger{background:rgba(244,63,94,.15);color:var(--rd);border:1px solid rgba(244,63,94,.3)}
.btn-danger:hover{background:rgba(244,63,94,.25)}
.btn-edit{background:rgba(108,99,255,.15);color:var(--ac);border:1px solid rgba(108,99,255,.3)}
.btn-edit:hover{background:rgba(108,99,255,.25)}
.btn-yellow{background:rgba(251,191,36,.15);color:var(--yl);border:1px solid rgba(251,191,36,.3)}
.btn-yellow:hover{background:rgba(251,191,36,.25)}
.auth-err{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);color:var(--rd);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
.auth-err.show{display:block}
.sidebar{width:220px;min-width:220px;background:var(--s);border-right:1px solid var(--b);display:flex;flex-direction:column;overflow-y:auto}
.logo{padding:20px 16px 16px;border-bottom:1px solid var(--b)}
.logo h2{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo small{color:var(--mu);font-size:11px}
.nav{padding:12px 8px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);cursor:pointer;color:var(--mu);font-size:13px;font-weight:500;transition:var(--tr);margin-bottom:2px}
.nav-item:hover{background:var(--b);color:var(--tx)}
.nav-item.active{background:linear-gradient(135deg,rgba(108,99,255,.2),rgba(139,92,246,.1));color:var(--ac);border:1px solid rgba(108,99,255,.2)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-user{padding:12px 16px;border-top:1px solid var(--b);background:var(--s2)}
.sidebar-user-name{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:2px}
.sidebar-user-role{font-size:11px;color:var(--mu)}
.sidebar-logout{width:100%;margin-top:8px;background:rgba(244,63,94,.1);color:var(--rd);border:1px solid rgba(244,63,94,.2);padding:8px;border-radius:var(--r);cursor:pointer;font-size:12px;font-weight:600;transition:var(--tr);font-family:var(--font)}
.sidebar-logout:hover{background:rgba(244,63,94,.2)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--b);background:var(--s);flex-shrink:0}
.topbar h1{font-size:18px;font-weight:700}
.topbar-time{font-size:13px;color:var(--mu);font-family:monospace}
.content{flex:1;overflow-y:auto;padding:24px}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--rl);padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--s2);border:1px solid var(--b);border-radius:var(--rl);padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:800;margin-bottom:4px}
.stat-label{font-size:12px;color:var(--mu)}
.agents-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.agents-header h2{font-size:16px;font-weight:700}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--b)}
th{color:var(--mu);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px;background:var(--s2)}
tr:hover td{background:var(--b)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-online{background:rgba(16,185,129,.15);color:var(--gr);border:1px solid rgba(16,185,129,.3)}
.badge-offline{background:rgba(100,100,120,.2);color:var(--mu);border:1px solid var(--b2)}
.td-actions{display:flex;gap:6px;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--s);border:1px solid var(--b2);border-radius:var(--rxl);padding:32px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:700;margin-bottom:20px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.modal-footer .btn{width:auto}
.shift-panel{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.shift-card{background:var(--s2);border:1px solid var(--b);border-radius:var(--rl);padding:20px;text-align:center}
.shift-card h3{font-size:13px;color:var(--mu);margin-bottom:12px;font-weight:600;text-transform:uppercase}
.shift-time{font-size:32px;font-weight:800;font-family:monospace;margin-bottom:8px}
.shift-status-text{font-size:12px;color:var(--mu)}
.checkin-btn{width:100%;padding:12px;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:var(--font);transition:var(--tr);margin-top:12px}
.checkin-btn.checkin{background:linear-gradient(135deg,var(--gr),#059669);color:#fff}
.checkin-btn.checkout{background:linear-gradient(135deg,var(--rd),#dc2626);color:#fff}
.checkin-btn:hover{opacity:.9;transform:translateY(-1px)}
.activity-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--b)}
.activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-in{background:var(--gr)}.dot-out{background:var(--rd)}
.activity-info{flex:1;min-width:0}
.activity-name{font-size:13px;font-weight:500}
.activity-desc{font-size:11px;color:var(--mu)}
.activity-time{font-size:11px;color:var(--mu);font-family:monospace;white-space:nowrap}
.toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--s);border:1px solid var(--b2);border-radius:var(--r);padding:12px 16px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:slideIn .2s ease;display:flex;align-items:center;gap:8px}
.toast-ok{border-color:rgba(16,185,129,.4);color:var(--gr)}
.toast-err{border-color:rgba(244,63,94,.4);color:var(--rd)}
.toast-info{border-color:rgba(108,99,255,.4);color:var(--ac)}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
.hidden{display:none!important}
.empty-state{text-align:center;padding:40px;color:var(--mu)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
@media(max-width:700px){.sidebar{width:60px;min-width:60px}.nav-label,.logo small,.sidebar-user-name,.sidebar-user-role{display:none}.logo h2{font-size:14px}.shift-panel{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="toast-container" id="toasts"></div>
<div class="auth-wrap" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo"><h1>ShiftDesk</h1><p>Agent Workforce Management</p></div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabAgent" onclick="switchAuthTab('agent')">🧑 Agent Login</div>
      <div class="auth-tab" id="tabAdmin" onclick="switchAuthTab('admin')">🔑 Admin</div>
    </div>
    <div id="authErr" class="auth-err"></div>
    <div id="agentLoginForm">
      <div class="form-group"><label>Email</label><input type="email" id="agentEmail" placeholder="agent@company.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="agentPass" placeholder="••••••••"></div>
      <button class="btn btn-primary" id="loginBtn" onclick="agentLogin()">Login</button>
      <p style="text-align:center;margin-top:12px"><span onclick="showForgotForm()" style="color:var(--ac);font-size:12px;cursor:pointer">🔑 Forgot Password?</span></p>
    </div>
    <!-- Forgot Password Form -->
    <div id="forgotForm" class="hidden">
      <p style="color:var(--mu);font-size:13px;margin-bottom:16px;text-align:center">Enter your email — we'll send a reset link</p>
      <div class="form-group"><label>Email</label><input type="email" id="forgotEmail" placeholder="agent@company.com"></div>
      <button class="btn btn-primary" id="forgotBtn" onclick="sendResetEmail()">📧 Send Reset Link</button>
      <p style="text-align:center;margin-top:12px"><span onclick="showForgotForm(false)" style="color:var(--mu);font-size:12px;cursor:pointer">← Back to Login</span></p>
    </div>
    <!-- Set New Password Form (after reset link click) -->
    <div id="newPassForm" class="hidden">
      <p style="color:var(--mu);font-size:13px;margin-bottom:16px;text-align:center">Set your new password</p>
      <div class="form-group"><label>New Password</label><input type="password" id="newPassInput" placeholder="Min 6 characters"></div>
      <button class="btn btn-primary" id="newPassBtn" onclick="setNewPassword()">✅ Save Password</button>
    </div>
    <div id="adminLoginForm" class="hidden">
      <div class="form-group"><label>Admin Email</label><input type="email" id="adminEmail" placeholder="admin@company.com"></div>
      <div class="form-group"><label>Admin Password</label><input type="password" id="adminPass" placeholder="••••••••"></div>
      <button class="btn btn-primary" id="adminLoginBtn" onclick="adminLogin()">Admin Login</button>
    </div>
  </div>
</div>
<div class="app hidden" id="mainApp">
  <div class="sidebar" id="sidebar">
    <div class="logo"><h2>ShiftDesk</h2><small>Workforce System</small></div>
    <nav class="nav" id="sideNav"></nav>
    <div class="sidebar-user">
      <div class="sidebar-user-name" id="sideUserName">—</div>
      <div class="sidebar-user-role" id="sideUserRole">—</div>
      <button class="sidebar-logout" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="topbar-time" id="liveClock">—</div></div>
    <div class="content" id="pageContent"></div>
  </div>
</div>
<div class="modal-bg" id="agentModal">
  <div class="modal">
    <h2 id="modalTitle">Add Agent</h2>
    <div id="agentModalErr" class="auth-err"></div>
    <div class="form-group"><label>Full Name</label><input type="text" id="mName" placeholder="Agent Name"></div>
    <div class="form-group"><label>Official Email</label><input type="email" id="mEmail" placeholder="agent@company.com"></div>
    <div class="form-group"><label>Department</label><select id="mDept"><option value="">Select Department</option><option value="Corporate">Corporate</option><option value="Retail">Retail</option><option value="Reseller">Reseller</option></select></div>
    <div class="form-group"><label>Role / Designation</label><input type="text" id="mRole" placeholder="e.g. Senior Agent"></div>
    <div class="form-group"><label>Country</label><select id="mCountry"><option value="Pakistan">Pakistan</option><option value="Saudi Arabia">Saudi Arabia</option><option value="UAE">UAE</option><option value="UK">UK</option><option value="USA">USA</option></select></div>
    <div class="form-group"><label>Shift Start</label><input type="time" id="mShiftStart" value="09:00"></div>
    <div class="form-group"><label>Agent Type</label><select id="mType"><option value="regular">Regular</option><option value="senior">Senior</option><option value="qa">QA</option><option value="manager">Manager</option><option value="admin">Admin</option></select></div>
    <p style="font-size:12px;color:var(--mu);margin-bottom:12px">📧 Agent will receive an email to set their own password.</p>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" onclick="closeAgentModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" id="saveAgentBtn" onclick="saveAgent()">Save Agent</button>
    </div>
  </div>
</div>
<script>

const SUPABASE_URL  = 'https://lasnonlixtvmarubbegf.supabase.co';
const SUPABASE_ANON = 'sb_publishable_V8X0Gv_HYXn03x4pXNLicA_8UDxZZqx';
const _db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
// Separate client for creating new auth users — isolated storage key
const _authHelper = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {auth:{persistSession:false,autoRefreshToken:false,storageKey:'_sd_helper'}});
let currentUser=null,currentAgent=null,isAdmin=false,editingAgentId=null,clockInterval=null,_sessionLoading=false;
const ADMIN_EMAILS=['admin@shiftdesk.online','usmansiddique692@gmail.com','admin@tracking.me'];

async function init(){
  startClock();
  // Use onAuthStateChange as single source of truth
  _db.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_OUT'){currentUser=null;currentAgent=null;isAdmin=false;showAuth();return;}
    if(event==='PASSWORD_RECOVERY'){
      showAuth();
      ['agentLoginForm','forgotForm','adminLoginForm'].forEach(id=>document.getElementById(id).classList.add('hidden'));
      document.getElementById('newPassForm').classList.remove('hidden');
      return;
    }
    if(session&&!_sessionLoading){
      _sessionLoading=true;
      await loadSession(session.user);
      _sessionLoading=false;
    }
  });
  // Check existing session on load
  const{data:{session}}=await _db.auth.getSession();
  if(session){_sessionLoading=true;await loadSession(session.user);_sessionLoading=false;}
  else showAuth();
}

async function loadSession(user){
  currentUser=user;
  if(ADMIN_EMAILS.includes(user.email)){
    isAdmin=true;
    showApp();
    _db.from('agents').select('*').eq('email',user.email).maybeSingle()
      .then(({data:ag})=>{ if(ag) currentAgent=ag; })
      .catch(()=>{});
    return;
  }
  try{
    const{data:ag,error}=await _db.from('agents').select('*').eq('email',user.email).maybeSingle();
    if(error||!ag){
      showToast('Profile not found. Contact your admin.','err');
      setTimeout(()=>_db.auth.signOut(),2500);
      return;
    }
    currentAgent=ag;
    isAdmin=(ag.type==='admin');
  }catch(e){
    showToast('Connection error. Please try again.','err');
    return;
  }
  showApp();
}

function switchAuthTab(tab){
  document.getElementById('tabAgent').className='auth-tab'+(tab==='agent'?' active':'');
  document.getElementById('tabAdmin').className='auth-tab'+(tab==='admin'?' active':'');
  document.getElementById('agentLoginForm').classList.toggle('hidden',tab!=='agent');
  document.getElementById('adminLoginForm').classList.toggle('hidden',tab!=='admin');
  if(tab==='agent'){
    document.getElementById('forgotForm').classList.add('hidden');
    document.getElementById('newPassForm').classList.add('hidden');
    document.getElementById('agentLoginForm').classList.remove('hidden');
  }
  document.getElementById('authErr').classList.remove('show');
  document.getElementById('authErr').removeAttribute('style');
}

async function agentLogin(){
  const email=document.getElementById('agentEmail').value.trim();
  const pass=document.getElementById('agentPass').value;
  if(!email||!pass){showAuthErr('Please fill all fields');return;}
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='Logging in...';
  const{error}=await _db.auth.signInWithPassword({email,password:pass});
  if(error){showAuthErr(error.message);btn.disabled=false;btn.textContent='Login';}
}

async function adminLogin(){
  const email=document.getElementById('adminEmail').value.trim();
  const pass=document.getElementById('adminPass').value;
  if(!email||!pass){showAuthErr('Please fill all fields');return;}
  const btn=document.getElementById('adminLoginBtn');
  btn.disabled=true;btn.textContent='Logging in...';
  const{error}=await _db.auth.signInWithPassword({email,password:pass});
  if(error){showAuthErr(error.message);btn.disabled=false;btn.textContent='Admin Login';}
}

function showAuthErr(msg){const el=document.getElementById('authErr');el.textContent=msg;el.classList.add('show');}

function showForgotForm(show=true){
  document.getElementById('agentLoginForm').classList.toggle('hidden',show);
  document.getElementById('forgotForm').classList.toggle('hidden',!show);
  document.getElementById('authErr').classList.remove('show');
}

async function sendResetEmail(){
  const email=document.getElementById('forgotEmail').value.trim();
  if(!email){showAuthErr('Please enter your email');return;}
  const btn=document.getElementById('forgotBtn');
  btn.disabled=true;btn.textContent='Sending...';
  const{error}=await _db.auth.resetPasswordForEmail(email,{redirectTo:'https://shiftdesk.online'});
  if(error){showAuthErr(error.message);btn.disabled=false;btn.textContent='📧 Send Reset Link';return;}
  const errEl=document.getElementById('authErr');
  errEl.style.background='rgba(16,185,129,.1)';errEl.style.borderColor='rgba(16,185,129,.3)';errEl.style.color='var(--gr)';
  errEl.textContent='✅ Reset link sent! Check your email.';errEl.classList.add('show');
  btn.disabled=false;btn.textContent='📧 Send Reset Link';
}

async function setNewPassword(){
  const pass=document.getElementById('newPassInput').value;
  if(!pass||pass.length<6){showAuthErr('Password must be at least 6 characters');return;}
  const btn=document.getElementById('newPassBtn');
  btn.disabled=true;btn.textContent='Saving...';
  const{error}=await _db.auth.updateUser({password:pass});
  if(error){showAuthErr(error.message);btn.disabled=false;btn.textContent='✅ Save Password';return;}
  await _db.auth.signOut();
  document.getElementById('newPassForm').classList.add('hidden');
  document.getElementById('agentLoginForm').classList.remove('hidden');
  const errEl=document.getElementById('authErr');
  errEl.style.background='rgba(16,185,129,.1)';errEl.style.borderColor='rgba(16,185,129,.3)';errEl.style.color='var(--gr)';
  errEl.textContent='✅ Password updated! Please login now.';errEl.classList.add('show');
  btn.disabled=false;btn.textContent='✅ Save Password';
}

async function logout(){await _db.auth.signOut();currentUser=null;currentAgent=null;isAdmin=false;}
function showAuth(){
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('authErr').classList.remove('show');
  // Reset forms to default state
  const lb=document.getElementById('loginBtn');if(lb){lb.disabled=false;lb.textContent='Login';}
  const ab=document.getElementById('adminLoginBtn');if(ab){ab.disabled=false;ab.textContent='Admin Login';}
  document.getElementById('forgotForm')?.classList.add('hidden');
  document.getElementById('newPassForm')?.classList.add('hidden');
  document.getElementById('agentLoginForm')?.classList.remove('hidden');
}

function showApp(){
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  buildNav();
  navTo(isAdmin?'dashboard':'myshift');
}

function buildNav(){
  document.getElementById('sideUserName').textContent=isAdmin?'Admin':(currentAgent?.name||'Agent');
  document.getElementById('sideUserRole').textContent=isAdmin?'Administrator':(currentAgent?.role||'Agent');
  const items=isAdmin?[{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'agents',icon:'👥',label:'Agents'},{id:'activity',icon:'📋',label:'Activity'}]:[{id:'myshift',icon:'⏱️',label:'My Shift'},{id:'activity',icon:'📋',label:'Activity'}];
  document.getElementById('sideNav').innerHTML=items.map(i=>`<div class="nav-item" id="nav_${i.id}" onclick="navTo('${i.id}')"><span class="nav-icon">${i.icon}</span><span class="nav-label">${i.label}</span></div>`).join('');
}

function navTo(page){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('nav_'+page);if(el)el.classList.add('active');
  const titles={dashboard:'Dashboard',agents:'Manage Agents',activity:'Activity Log',myshift:'My Shift'};
  document.getElementById('pageTitle').textContent=titles[page]||page;
  if(page==='dashboard')renderDashboard();
  else if(page==='agents')renderAgents();
  else if(page==='activity')renderActivity();
  else if(page==='myshift')renderMyShift();
}

function startClock(){
  if(clockInterval)clearInterval(clockInterval);
  function tick(){
    const tz=currentAgent?.timezone||'Asia/Karachi';
    const now=new Date();
    const t=now.toLocaleTimeString('en-US',{timeZone:tz,hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const d=now.toLocaleDateString('en-US',{timeZone:tz,weekday:'short',month:'short',day:'numeric'});
    const el=document.getElementById('liveClock');if(el)el.textContent=d+' '+t;
    const sc=document.getElementById('shiftClock');if(sc)sc.textContent=t;
  }
  tick();clockInterval=setInterval(tick,1000);
}

async function renderDashboard(){
  const c=document.getElementById('pageContent');c.innerHTML='<div class="empty-state"><div class="icon">⏳</div>Loading...</div>';
  const today=new Date().toISOString().slice(0,10);
  const[{data:agents},{data:ts}]=await Promise.all([_db.from('agents').select('*').order('name'),_db.from('shift_status').select('*').eq('date',today)]);
  const total=agents?.length||0,online=ts?.filter(s=>s.online).length||0,ci=ts?.filter(s=>s.check_in).length||0;
  c.innerHTML='<div class="stats-grid"><div class="stat-card"><div class="stat-num" style="color:var(--ac)">'+total+'</div><div class="stat-label">Total Agents</div></div><div class="stat-card"><div class="stat-num" style="color:var(--gr)">'+online+'</div><div class="stat-label">Online Now</div></div><div class="stat-card"><div class="stat-num" style="color:var(--yl)">'+ci+'</div><div class="stat-label">Checked In Today</div></div><div class="stat-card"><div class="stat-num" style="color:var(--mu)">'+(total-online)+'</div><div class="stat-label">Offline</div></div></div><div class="card"><div class="card-title">📡 Live Agent Status</div><div class="table-wrap"><table><thead><tr><th>Agent</th><th>Dept</th><th>Status</th><th>Check In</th><th>Check Out</th><th>Hours</th></tr></thead><tbody>'+(agents||[]).map(a=>{const s=ts?.find(x=>x.agent_id===a.id)||{};const hrs=s.check_in&&s.check_out?calcHours(s.check_in,s.check_out):(s.check_in?'Active':'—');return '<tr><td><b>'+a.name+'</b><br><span style="color:var(--mu);font-size:11px">'+( a.email||'')+'</span></td><td>'+(a.dept||'—')+'</td><td><span class="badge '+(s.online?'badge-online':'badge-offline')+'">'+(s.online?'🟢 Online':'⚫ Offline')+'</span></td><td>'+(s.check_in?fmtTime(s.check_in):'—')+'</td><td>'+(s.check_out?fmtTime(s.check_out):'—')+'</td><td>'+hrs+'</td></tr>';}).join('')+'</tbody></table></div></div>';
}

async function renderAgents(){
  const c=document.getElementById('pageContent');c.innerHTML='<div class="empty-state"><div class="icon">⏳</div>Loading...</div>';
  const{data:agents}=await _db.from('agents').select('*').order('name');
  c.innerHTML=`<div class="agents-header"><h2>All Agents (${agents?.length||0})</h2><button class="btn btn-primary btn-sm" onclick="openAddAgent()">➕ Add Agent</button></div><div class="card" style="padding:0"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Dept</th><th>Role</th><th>Type</th><th>Shift</th><th>Actions</th></tr></thead><tbody>${agents?.length?agents.map(a=>`<tr><td><b>${a.name}</b></td><td style="font-size:12px;color:var(--mu)">${a.email||'—'}</td><td>${a.dept||'—'}</td><td>${a.role||'—'}</td><td><span class="badge" style="background:rgba(108,99,255,.15);color:var(--ac);border:1px solid rgba(108,99,255,.3)">${a.type||'regular'}</span></td><td>${a.shift_start||'09:00'}</td><td><div class="td-actions"><button class="btn btn-edit btn-sm" onclick="openEditAgent('${a.id}')">✏️ Edit</button><button class="btn btn-yellow btn-sm" onclick="resetAgentPassword('${a.email}','${a.name.replace(/'/g,'')}')">🔑 Reset Pass</button><button class="btn btn-danger btn-sm" onclick="deleteAgent('${a.id}','${a.name.replace(/'/g,'')}')">🗑️ Del</button></div></td></tr>`).join(''):'<tr><td colspan="7" style="text-align:center;color:var(--mu);padding:30px">No agents yet. Click Add Agent.</td></tr>'}</tbody></table></div></div>`;
}

function openAddAgent(){
  editingAgentId=null;
  ['mName','mEmail','mRole'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('mDept').value='';
  document.getElementById('mCountry').value='Pakistan';
  document.getElementById('mShiftStart').value='09:00';
  document.getElementById('mType').value='regular';
  document.getElementById('modalTitle').textContent='➕ Add New Agent';
  document.getElementById('agentModalErr').classList.remove('show');
  document.getElementById('agentModal').classList.add('open');
}

async function openEditAgent(id){
  const{data:a}=await _db.from('agents').select('*').eq('id',id).single();
  if(!a){showToast('Agent not found','err');return;}
  editingAgentId=id;
  document.getElementById('mName').value=a.name||'';
  document.getElementById('mEmail').value=a.email||'';
  document.getElementById('mDept').value=a.dept||'';
  document.getElementById('mRole').value=a.role||'';
  document.getElementById('mCountry').value=a.country||'Pakistan';
  document.getElementById('mShiftStart').value=a.shift_start||'09:00';
  document.getElementById('mType').value=a.type||'regular';
  document.getElementById('modalTitle').textContent='✏️ Edit Agent';
  document.getElementById('agentModalErr').classList.remove('show');
  document.getElementById('agentModal').classList.add('open');
}
function closeAgentModal(){document.getElementById('agentModal').classList.remove('open');}

async function saveAgent(){
  const name=document.getElementById('mName').value.trim();
  const email=document.getElementById('mEmail').value.trim();
  const dept=document.getElementById('mDept').value.trim();
  const role=document.getElementById('mRole').value.trim();
  const country=document.getElementById('mCountry').value;
  const shift_start=document.getElementById('mShiftStart').value;
  const type=document.getElementById('mType').value;
  const tzMap={'Pakistan':'Asia/Karachi','Saudi Arabia':'Asia/Riyadh','UAE':'Asia/Dubai','UK':'Europe/London','USA':'America/New_York'};
  const timezone=tzMap[country]||'Asia/Karachi';
  const errEl=document.getElementById('agentModalErr');
  if(!name){errEl.textContent='Name is required';errEl.classList.add('show');return;}
  if(!email){errEl.textContent='Email is required';errEl.classList.add('show');return;}
  if(!dept){errEl.textContent='Department is required';errEl.classList.add('show');return;}
  const btn=document.getElementById('saveAgentBtn');btn.disabled=true;btn.textContent='Saving...';
  try{
    if(!editingAgentId){
      // Create auth user with random temp password (agent will reset via email)
      const tempPass='Tmp_'+Math.random().toString(36).slice(2,10)+'!1';
      const{data:su,error:se}=await _authHelper.auth.signUp({email,password:tempPass,options:{data:{name}}});
      if(se&&!se.message.toLowerCase().includes('already registered')){
        errEl.textContent='Auth Error: '+se.message;errEl.classList.add('show');btn.disabled=false;btn.textContent='Save Agent';return;
      }
      const auth_id=su?.user?.id||null;
      const{error:de}=await _db.from('agents').upsert({name,email,dept,role,country,timezone,shift_start,type,auth_id},{onConflict:'email'});
      if(de){errEl.textContent='DB Error: '+de.message;errEl.classList.add('show');btn.disabled=false;btn.textContent='Save Agent';return;}
      // Send password reset email so agent sets their own password
      await _db.auth.resetPasswordForEmail(email,{redirectTo:'https://shiftdesk.online'});
      showToast('✅ Agent added! Password setup email sent to: '+email,'ok');
    }else{
      const{error:de}=await _db.from('agents').update({name,email,dept,role,country,timezone,shift_start,type}).eq('id',editingAgentId);
      if(de){errEl.textContent='DB Error: '+de.message;errEl.classList.add('show');btn.disabled=false;btn.textContent='Save Agent';return;}
      showToast('✅ Agent updated!','ok');
    }
    closeAgentModal();renderAgents();
  }catch(e){errEl.textContent='Error: '+e.message;errEl.classList.add('show');}
  btn.disabled=false;btn.textContent='Save Agent';
}

async function deleteAgent(id,name){
  if(!confirm('Delete agent "'+name+'"?'))return;
  const{error}=await _db.from('agents').delete().eq('id',id);
  if(error){showToast('Error: '+error.message,'err');return;}
  showToast('Agent deleted: '+name,'ok');renderAgents();
}

async function resetAgentPassword(email,name){
  if(!confirm('Send password reset email to '+name+' ('+email+')?'))return;
  const{error}=await _db.auth.resetPasswordForEmail(email,{redirectTo:'https://shiftdesk.online'});
  if(error){showToast('Error: '+error.message,'err');return;}
  showToast('✅ Password reset email sent to '+name,'ok');
}

async function renderMyShift(){
  if(!currentAgent){return;}
  const c=document.getElementById('pageContent');
  const today=new Date().toISOString().slice(0,10);
  const{data:status}=await _db.from('shift_status').select('*').eq('agent_id',currentAgent.id).eq('date',today).maybeSingle();
  const isIn=status?.online||false,hasIn=!!status?.check_in,hasOut=!!status?.check_out;
  c.innerHTML='<div class="card" style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:16px"><div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">👤</div><div><div style="font-size:18px;font-weight:800">'+currentAgent.name+'</div><div style="color:var(--mu);font-size:13px">'+(currentAgent.role||'Agent')+' • '+(currentAgent.dept||'')+'</div><div style="color:var(--mu);font-size:12px">'+(currentAgent.email||'')+'</div></div><div style="margin-left:auto"><span class="badge '+(isIn?'badge-online':'badge-offline')+'">'+(isIn?'🟢 Online':'⚫ Offline')+'</span></div></div></div><div class="shift-panel"><div class="shift-card"><h3>⏰ Current Time</h3><div class="shift-time" id="shiftClock">—</div><div class="shift-status-text">'+(currentAgent.timezone||'Asia/Karachi')+'</div></div><div class="shift-card"><h3>📅 Shift Start</h3><div class="shift-time">'+(currentAgent.shift_start||'09:00')+'</div><div class="shift-status-text">'+(currentAgent.country||'Pakistan')+'</div></div></div><div class="card" style="margin-bottom:16px"><div class="card-title">Today&#39;s Shift</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px"><div class="stat-card"><div class="stat-num" style="color:var(--gr);font-size:18px">'+(status?.check_in?fmtTime(status.check_in):'—')+'</div><div class="stat-label">Check In</div></div><div class="stat-card"><div class="stat-num" style="color:var(--rd);font-size:18px">'+(status?.check_out?fmtTime(status.check_out):'—')+'</div><div class="stat-label">Check Out</div></div><div class="stat-card"><div class="stat-num" style="color:var(--ac);font-size:18px">'+(status?.check_in&&status?.check_out?calcHours(status.check_in,status.check_out):(status?.check_in?'Active':'—'))+'</div><div class="stat-label">Hours</div></div></div>'+(!hasIn?'<button class="checkin-btn checkin" onclick="doCheckIn()">✅ Check In</button>':(!hasOut?'<button class="checkin-btn checkout" onclick="doCheckOut()">🔴 Check Out</button>':'<div style="text-align:center;padding:16px;color:var(--gr);font-weight:600">✅ Shift Complete for Today</div>'))+'</div><div class="card"><div class="card-title">📋 Recent Activity</div><div id="myActivityLog">Loading...</div></div>';
  startClock();loadMyActivity();
}

async function doCheckIn(){
  const today=new Date().toISOString().slice(0,10);const now=new Date().toISOString();
  const{error}=await _db.from('shift_status').upsert({agent_id:currentAgent.id,agent_name:currentAgent.name,dept:currentAgent.dept,date:today,online:true,check_in:now},{onConflict:'agent_id,date'});
  if(error){showToast('Error: '+error.message,'err');return;}
  await _db.from('activity_logs').insert({agent_id:currentAgent.id,agent_name:currentAgent.name,dept:currentAgent.dept,action:'check_in',detail:'Check In',date:today,time:now});
  showToast('Checked in! Have a great shift 🎯','ok');renderMyShift();
}

async function doCheckOut(){
  const today=new Date().toISOString().slice(0,10);const now=new Date().toISOString();
  const{error}=await _db.from('shift_status').update({online:false,check_out:now}).eq('agent_id',currentAgent.id).eq('date',today);
  if(error){showToast('Error: '+error.message,'err');return;}
  await _db.from('activity_logs').insert({agent_id:currentAgent.id,agent_name:currentAgent.name,dept:currentAgent.dept,action:'check_out',detail:'Check Out',date:today,time:now});
  showToast('Checked out! Great work 👏','ok');renderMyShift();
}

async function loadMyActivity(){
  const{data:logs}=await _db.from('activity_logs').select('*').eq('agent_id',currentAgent.id).order('created_at',{ascending:false}).limit(20);
  const el=document.getElementById('myActivityLog');if(!el)return;
  if(!logs?.length){el.innerHTML='<div class="empty-state"><div class="icon">📭</div>No activity yet</div>';return;}
  el.innerHTML=logs.map(l=>'<div class="activity-item"><div class="activity-dot '+(l.action==='check_in'?'dot-in':'dot-out')+'"></div><div class="activity-info"><div class="activity-name">'+(l.action==='check_in'?'✅ Checked In':'🔴 Checked Out')+'</div><div class="activity-desc">'+fmtDate(l.created_at||l.time)+'</div></div><div class="activity-time">'+fmtTime(l.created_at||l.time)+'</div></div>').join('');
}

async function renderActivity(){
  const c=document.getElementById('pageContent');c.innerHTML='<div class="empty-state"><div class="icon">⏳</div>Loading...</div>';
  const q=isAdmin?_db.from('activity_logs').select('*').order('created_at',{ascending:false}).limit(100):_db.from('activity_logs').select('*').eq('agent_id',currentAgent?.id).order('created_at',{ascending:false}).limit(50);
  const{data:logs}=await q;
  c.innerHTML='<div class="card"><div class="card-title">📋 Activity Log ('+(logs?.length||0)+' entries)</div>'+(!logs?.length?'<div class="empty-state"><div class="icon">📭</div>No activity recorded</div>':logs.map(l=>'<div class="activity-item"><div class="activity-dot '+(l.action==='check_in'?'dot-in':'dot-out')+'"></div><div class="activity-info"><div class="activity-name">'+(isAdmin?'<b>'+l.agent_name+'</b> — ':'')+(l.action==='check_in'?'✅ Checked In':'🔴 Checked Out')+'</div><div class="activity-desc">'+(l.dept||'')+' • '+fmtDate(l.created_at||l.time)+'</div></div><div class="activity-time">'+fmtTime(l.created_at||l.time)+'</div></div>').join(''))+'</div>';
}

function fmtTime(ts){if(!ts)return '—';try{const tz=currentAgent?.timezone||'Asia/Karachi';return new Date(ts).toLocaleTimeString('en-US',{timeZone:tz,hour12:true,hour:'2-digit',minute:'2-digit'});}catch{return ts.slice(11,16);}}
function fmtDate(ts){if(!ts)return '—';try{return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch{return ts.slice(0,10);}}
function calcHours(i,o){if(!i||!o)return '—';const d=(new Date(o)-new Date(i))/3600000;return d.toFixed(1)+'h';}
function showToast(msg,type='ok'){const c=document.getElementById('toasts');const t=document.createElement('div');t.className='toast toast-'+(type==='ok'?'ok':type==='err'?'err':'info');t.innerHTML=(type==='ok'?'✅':type==='err'?'❌':'ℹ️')+' '+msg;c.appendChild(t);setTimeout(()=>t.remove(),4000);}

init();

</script>
</body>
</html>
