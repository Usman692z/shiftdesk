<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="200" height="200" rx="44" ry="44" fill="url(#bg)"/>
  <rect width="200" height="200" rx="44" ry="44" fill="url(#shine)"/>
  <!-- Clock circle -->
  <circle cx="100" cy="88" r="46" fill="none" stroke="white" stroke-width="10" stroke-opacity="0.95"/>
  <!-- Clock hands -->
  <line x1="100" y1="88" x2="100" y2="62" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <line x1="100" y1="88" x2="122" y2="100" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="100" cy="88" r="5" fill="white"/>
  <!-- Bottom bar (desk) -->
  <rect x="38" y="152" width="124" height="11" rx="5.5" fill="white" fill-opacity="0.9"/>
  <rect x="62" y="163" width="76" height="8" rx="4" fill="white" fill-opacity="0.5"/>
</svg>
